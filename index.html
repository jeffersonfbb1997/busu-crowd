<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BusU-Crowd</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --blue: #1a73e8; --sidebar-w: 300px; --z-ui: 4000; --green: #34a853; --gray: #70757a; --red: #ea4335; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Inter', sans-serif; overflow: hidden; background: #e5e3df; }
        #map { position: absolute; inset: 0; z-index: 1; }

        /* Sidebar Style */
        #sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w); background: white; z-index: 5000; transition: transform 0.3s ease; display: flex; flex-direction: column; transform: translateX(-100%); box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
        #sidebar.active { transform: translateX(0); }
        #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 4500; backdrop-filter: blur(2px); }
        #sidebar-overlay.active { display: block; }
        .sidebar-view { display: none; flex-direction: column; height: 100%; width: 100%; padding: 20px; overflow-y: auto; }
        .sidebar-view.active { display: flex; }

        .section-header { display: flex; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #f1f3f4; padding-bottom: 15px; }
        .section-title { font-weight: 800; font-size: 16px; color: #202124; margin: 0; }

        /* LED Style */
        .active-label { font-size: 9px; color: var(--green); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; }
        .active-label::before { content: ''; width: 5px; height: 5px; background: var(--green); border-radius: 50%; margin-right: 6px; box-shadow: 0 0 6px var(--green); animation: blink 1.2s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* UI Flutuante */
        .menu-trigger { position: absolute; top: 15px; left: 15px; z-index: var(--z-ui); width: 44px; height: 44px; border-radius: 50%; background: white; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #5f6368; cursor: pointer; }

        #lines-drawer { position: absolute; top: 70px; left: 15px; z-index: var(--z-ui); width: 230px; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); transition: 0.3s; max-height: 40vh; overflow: hidden; border: 1px solid white; }
        #lines-drawer.collapsed { width: 44px; height: 44px; border-radius: 50%; }
        #lines-drawer.collapsed .active-label, #lines-drawer.collapsed #floating-active-list { display: none; }

        /* Card Inferior Slim */
        .bottom-ui { position: absolute; bottom: 15px; left: 0; width: 100%; display: flex; justify-content: center; z-index: var(--z-ui); pointer-events: none; }
        .info-card { width: 92%; max-width: 340px; background: white; border-radius: 20px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); pointer-events: auto; transition: all 0.4s ease; overflow: hidden; }
        .info-card.minimized { height: 42px; padding-top: 13px; }
        .info-card.minimized #status-display, .info-card.minimized #global-counter { display: none; }

        /* Bus Items */
        .bus-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; cursor: pointer; }
        .bus-logo-mini { width: 18px; height: 18px; border-radius: 4px; object-fit: contain; margin-right: 10px; }
        .bus-title { font-weight: 700; color: #202124; font-size: 12px; }
        .bus-subtitle { font-size: 10px; color: var(--gray); font-weight: 500; }
        .bus-eta { font-size: 11px; color: var(--green); font-weight: 800; background: #e6f4ea; padding: 1px 6px; border-radius: 4px; }

        /* Logo Selection Admin & Transmissão */
        .company-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .company-option { flex: 1; border: 2px solid #f1f3f4; border-radius: 12px; padding: 10px; cursor: pointer; transition: 0.2s; text-align: center; background: white; }
        .company-option img { height: 25px; max-width: 100%; object-fit: contain; }
        .company-option.selected { border-color: var(--blue); background: #e8f0fe; }

        /* Pins */
        .bus-pin { width: 44px; height: 44px; border: 2.5px solid white; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .bus-pin img { transform: rotate(45deg); width: 22px; height: 22px; object-fit: contain; }
        
        .side-btns { position: absolute; right: 15px; bottom: 160px; z-index: var(--z-ui); display: flex; flex-direction: column; gap: 10px; }
        .btn-circle { width: 50px; height: 50px; border-radius: 50%; background: white; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #5f6368; cursor: pointer; }
        .btn-circle.active { background: var(--red) !important; color: white !important; animation: pulse-red 1.5s infinite; }

        .standby-badge { font-size: 9px; background: #f1f3f4; color: #9aa0a6; padding: 2px 6px; border-radius: 4px; margin-left: auto; font-weight: 700; text-transform: uppercase; }
        .nav-item-custom { display: flex; align-items: center; padding: 12px; border-radius: 12px; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-size: 13px; font-weight: 500; color: #3c4043; transition: 0.2s; }
        .nav-item-custom:hover { background: #f8f9fa; color: var(--blue); }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.6); } 70% { box-shadow: 0 0 0 15px rgba(234, 67, 53, 0); } 100% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0); } }
    </style>
</head>
<body>

    <div id="sidebar-overlay" onclick="window.toggleSidebar()"></div>

    <aside id="sidebar">
        <!-- VISTA USUÁRIO -->
        <div id="view-main" class="sidebar-view active">
            <div class="section-header">
                <h5 class="section-title text-primary">BusU-Crowd</h5>
                <i class="bi bi-x-lg cursor-pointer ms-auto fs-5 text-muted" onclick="window.toggleSidebar()"></i>
            </div>
            <div id="auth-area" class="mb-4"></div>
            <nav>
                <button class="nav-item-custom" onclick="window.toggleSidebar()"><i class="bi bi-map text-primary me-3 fs-5"></i> Mapa em Tempo Real</button>
                <button class="nav-item-custom" onclick="window.switchView('planning')"><i class="bi bi-signpost-split text-success me-3 fs-5"></i> Planejar Rota</button>
                <div class="p-3 text-muted" style="font-size:11px">Funções Favoritos, Ranking e Contribuições em Standby...</div>
            </nav>
            <div id="admin-entry" style="display:none" class="mt-auto">
                <hr><button class="btn btn-dark w-100 py-2 fw-bold text-uppercase" style="font-size:11px" onclick="window.switchView('admin-dashboard')">⚙️ Painel Administrativo</button>
            </div>
        </div>

        <!-- DASHBOARD ADMIN -->
        <div id="view-admin-dashboard" class="sidebar-view">
            <div class="section-header">
                <i class="bi bi-arrow-left fs-4 cursor-pointer me-3 text-primary" onclick="window.switchView('main')"></i>
                <h6 class="section-title">Painel Administrativo</h6>
            </div>
            <button class="nav-item-custom" onclick="window.switchView('admin-lines')"><i class="bi bi-signpost-2 text-primary me-3"></i> Gestão de Linhas</button>
        </div>

        <!-- GESTÃO CRUD LINHAS -->
        <div id="view-admin-lines" class="sidebar-view">
            <div class="section-header">
                <i class="bi bi-arrow-left fs-4 cursor-pointer me-3 text-primary" onclick="window.switchView('admin-dashboard')"></i>
                <h6 class="section-title">Gestão de Linhas</h6>
            </div>
            <div class="card card-body border-0 bg-light mb-3 shadow-sm">
                <input type="hidden" id="admDbKey">
                <input type="text" id="admID" class="form-control form-control-sm mb-2" placeholder="ID (L26)">
                <input type="text" id="admNome" class="form-control form-control-sm mb-2" placeholder="Nome">
                <input type="text" id="admVia" class="form-control form-control-sm mb-2" placeholder="Via / Trajeto">
                
                <label class="small fw-bold text-muted mb-2">Selecione a Operadora:</label>
                <div class="company-selector" id="admin-company-select">
                    <div class="company-option" onclick="window.selectCompany('atlantico', 'admin')" id="adm-opt-atlantico">
                        <img src="https://i.ibb.co/3ykG4S7/atlantico-logo.png" alt="Atlântico">
                    </div>
                    <div class="company-option" onclick="window.selectCompany('viametro', 'admin')" id="adm-opt-viametro">
                        <img src="https://i.ibb.co/9V9pLp8/viametro-logo.png" alt="Via Metro">
                    </div>
                </div>

                <div class="d-flex gap-2 mb-3">
                    <input type="color" id="admCor" class="form-control form-control-color border-0 flex-grow-1" value="#1a73e8">
                    <button class="btn btn-white btn-sm shadow-sm border" onclick="window.randomizeColorInput()"><i class="bi bi-shuffle"></i></button>
                </div>
                <button id="btn-save-line" class="btn btn-primary btn-sm w-100 fw-bold" onclick="window.saveLine()">SALVAR</button>
                <button class="btn btn-link btn-sm w-100 text-muted" onclick="window.clearAdminForm()">Limpar campos</button>
            </div>
            <div id="admin-lines-list-crud" class="list-group list-group-flush"></div>
        </div>

        <!-- PLANEJAR ROTA -->
        <div id="view-planning" class="sidebar-view">
            <div class="section-header">
                <i class="bi bi-arrow-left fs-4 cursor-pointer me-3 text-primary" onclick="window.switchView('main')"></i>
                <h6 class="section-title">Linhas Disponíveis</h6>
            </div>
            <div id="planning-all-lines" class="list-group list-group-flush"></div>
        </div>
    </aside>

    <button class="menu-trigger" onclick="window.toggleSidebar()"><i class="bi bi-list"></i></button>

    <div id="lines-drawer" class="p-3 shadow">
        <div class="d-flex justify-content-between align-items-center mb-3" onclick="window.toggleDrawer()" style="cursor:pointer">
            <span class="active-label">LINHAS ATIVAS</span>
            <i class="bi bi-chevron-up text-muted" style="font-size:12px" id="drawer-icon"></i>
        </div>
        <div id="floating-active-list"></div>
    </div>

    <div class="side-btns">
        <button class="btn-circle shadow" onclick="window.geoCenter()"><i class="bi bi-crosshair"></i></button>
        <button id="action-btn" class="btn-circle shadow" style="display:none" onclick="window.onActionClick()"><i id="action-icon" class="bi bi-broadcast"></i></button>
        <button class="btn-circle shadow"><i class="bi bi-eye"></i></button>
    </div>

    <div class="bottom-ui">
        <div class="info-card shadow-lg" id="bottom-info-card">
            <div class="d-flex justify-content-between align-items-center" onclick="window.toggleBottomCard()" style="cursor:pointer; height: 18px;">
                <span class="active-label">STATUS EM TEMPO REAL • 5KM</span>
                <i class="bi bi-chevron-down text-muted" style="font-size:12px" id="bottom-card-icon"></i>
            </div>
            <div id="status-display" class="mt-3"></div>
            <div id="global-counter" class="mt-2 pt-2 border-top text-center" style="display:none; font-size:9px; font-weight:800; color:var(--blue);">
                <span id="total-active-text"></span>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- MODAL 1: SELECIONAR LINHA -->
    <div class="modal fade" id="modalLine" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered px-4"><div class="modal-content border-0 shadow-lg" style="border-radius:24px"><div class="modal-body p-4 text-center">
        <h6 class="fw-bold mb-3">Qual linha você está?</h6>
        <select id="line-select" class="form-select form-select-lg mb-4 rounded-4 border-0 bg-light" style="font-size:14px"></select>
        <button class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow" onclick="window.openCompanySelect()">PRÓXIMO</button>
    </div></div></div></div>

    <!-- MODAL 2: SELECIONAR EMPRESA -->
    <div class="modal fade" id="modalCompany" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered px-4"><div class="modal-content border-0 shadow-lg" style="border-radius:24px"><div class="modal-body p-4 text-center">
        <h6 class="fw-bold mb-4">Selecione a operadora do ônibus:</h6>
        <div class="company-selector" id="trans-company-select">
            <div class="company-option" onclick="window.selectCompany('atlantico', 'trans')" id="trans-opt-atlantico">
                <img src="https://i.ibb.co/3ykG4S7/atlantico-logo.png" alt="Atlântico">
            </div>
            <div class="company-option" onclick="window.selectCompany('viametro', 'trans')" id="trans-opt-viametro">
                <img src="https://i.ibb.co/9V9pLp8/viametro-logo.png" alt="Via Metro">
            </div>
        </div>
        <button class="btn btn-success w-100 py-3 fw-bold rounded-pill shadow mt-2" onclick="window.startTrack()">INICIAR TRANSMISSÃO</button>
    </div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, remove, push } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7qohXZb_DYFplLOtt5YiqbahwhNYGPck",
            authDomain: "busu-crowd.firebaseapp.com",
            projectId: "busu-crowd",
            storageBucket: "busu-crowd.firebasestorage.app",
            messagingSenderId: "48985646106",
            appId: "1:48985646106:web:1c7b80091855ad01609da3"
        };

        const COMPANIES = {
            atlantico: { name: "Atlântico", logo: "https://i.ibb.co/3ykG4S7/atlantico-logo.png", favicon: "https://i.ibb.co/N2LqV8q/atlantico-favicon.png" },
            viametro: { name: "Via Metro", logo: "https://i.ibb.co/9V9pLp8/viametro-logo.png", favicon: "https://i.ibb.co/Z1M2ZpS/viametro-favicon.png" }
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "jeffersonfbb1997@gmail.com";
        const map = L.map('map', { zoomControl: false }).setView([-14.7981, -39.0347], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let user = null, watchID = null, currentLineKey = null, currentCompany = 'atlantico', userMarker = null;
        let adminSelectedCompany = 'atlantico';
        const markers = {}, configLinhas = {};

        const calcDist = (la1, lo1, la2, lo2) => {
            const R = 6371;
            const dLat = (la2-la1)*Math.PI/180; const dLon = (lo2-lo1)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        };

        const randomColor = () => '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');

        window.toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        };

        window.switchView = (v) => {
            document.querySelectorAll('.sidebar-view').forEach(view => view.classList.remove('active'));
            document.getElementById('view-' + v).classList.add('active');
        };

        window.toggleDrawer = () => {
            const isCollapsed = document.getElementById('lines-drawer').classList.toggle('collapsed');
            document.getElementById('drawer-icon').className = isCollapsed ? 'bi bi-chevron-down' : 'bi bi-chevron-up';
        };

        window.toggleBottomCard = () => {
            const isMin = document.getElementById('bottom-info-card').classList.toggle('minimized');
            document.getElementById('bottom-card-icon').className = isMin ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
        };

        window.fazeZoom = (id) => {
            if(markers[id]) { map.flyTo(markers[id].getLatLng(), 17); markers[id].openPopup(); }
            if(window.innerWidth < 991) window.toggleSidebar();
        };

        window.geoCenter = () => {
            navigator.geolocation.getCurrentPosition(p => {
                const lat = p.coords.latitude, lng = p.coords.longitude;
                map.flyTo([lat, lng], 17);
                if (userMarker) { userMarker.setLatLng([lat, lng]); } 
                else {
                    userMarker = L.marker([lat, lng], { icon: L.divIcon({ className: 'user-marker-icon' }), zIndexOffset: 2500 }).addTo(map);
                }
            }, null, {enableHighAccuracy:true});
        };

        // --- COMPANY SELECT LOGIC ---
        window.selectCompany = (compId, context) => {
            if(context === 'admin') {
                adminSelectedCompany = compId;
                document.querySelectorAll('#admin-company-select .company-option').forEach(el => el.classList.remove('selected'));
                document.getElementById(`adm-opt-${compId}`).classList.add('selected');
            } else {
                currentCompany = compId;
                document.querySelectorAll('#trans-company-select .company-option').forEach(el => el.classList.remove('selected'));
                document.getElementById(`trans-opt-${compId}`).classList.add('selected');
            }
        };

        window.openCompanySelect = () => {
            const lineKey = document.getElementById('line-select').value;
            if(!lineKey) return;
            bootstrap.Modal.getOrCreateInstance(document.getElementById('modalLine')).hide();
            bootstrap.Modal.getOrCreateInstance(document.getElementById('modalCompany')).show();
        };

        window.fazerLogin = () => signInWithPopup(auth, provider);
        window.fazerLogout = () => { if(confirm("Sair?")) signOut(auth).then(() => { localStorage.removeItem('busu_active_line'); location.reload(); }); };

        window.onActionClick = () => watchID ? window.stopTrack() : new bootstrap.Modal(document.getElementById('modalLine')).show();

        window.startTrack = () => {
            const lineKey = document.getElementById('line-select').value;
            localStorage.setItem('busu_active_line', lineKey);
            localStorage.setItem('busu_active_company', currentCompany);
            iniciarGPS(lineKey, currentCompany);
            bootstrap.Modal.getInstance(document.getElementById('modalCompany')).hide();
        };

        function iniciarGPS(lineKey, compId) {
            if(watchID) navigator.geolocation.clearWatch(watchID);
            currentLineKey = lineKey;
            watchID = navigator.geolocation.watchPosition(p => {
                if(!user) return;
                const path = `onibus/${lineKey}/${user.uid}`;
                set(ref(db, path), { lat: p.coords.latitude, lng: p.coords.longitude, company: compId, timestamp: Date.now() });
                onDisconnect(ref(db, path)).remove();
                document.getElementById('action-btn').classList.add('active');
                document.getElementById('action-icon').className = 'bi bi-stop-circle-fill';
            }, null, {enableHighAccuracy:true});
        }

        window.stopTrack = () => {
            if(watchID) {
                navigator.geolocation.clearWatch(watchID);
                remove(ref(db, `onibus/${currentLineKey}/${user.uid}`));
                watchID = null;
                localStorage.removeItem('busu_active_line');
                document.getElementById('action-btn').classList.remove('active');
                document.getElementById('action-icon').className = 'bi bi-broadcast';
            }
        };

        window.saveLine = () => {
            const id = document.getElementById('admID').value;
            const dbKey = document.getElementById('admDbKey').value;
            if(!id) return alert("ID obrigatório");
            const finalKey = dbKey || push(ref(db, 'config/linhas')).key;
            set(ref(db, 'config/linhas/' + finalKey), {
                id: id,
                nome: document.getElementById('admNome').value,
                via: document.getElementById('admVia').value || "Via Principal",
                cor: document.getElementById('admCor').value,
                company: adminSelectedCompany,
                latTerminal: -14.7981, lngTerminal: -39.0347
            }).then(() => { alert("Linha Salva!"); window.clearAdminForm(); });
        };

        window.loadLineForEdit = (key) => {
            const c = configLinhas[key];
            document.getElementById('admDbKey').value = key;
            document.getElementById('admID').value = c.id;
            document.getElementById('admNome').value = c.nome;
            document.getElementById('admVia').value = c.via;
            document.getElementById('admCor').value = c.cor;
            window.selectCompany(c.company || 'atlantico', 'admin');
            document.getElementById('btn-save-line').innerText = "ATUALIZAR";
        };

        window.clearAdminForm = () => {
            document.getElementById('admDbKey').value = "";
            document.getElementById('admID').value = "";
            document.getElementById('admNome').value = "";
            document.getElementById('admVia').value = "";
            window.selectCompany('atlantico', 'admin');
            document.getElementById('btn-save-line').innerText = "SALVAR";
        };

        window.deleteLine = (key) => { if(confirm("Excluir?")) remove(ref(db, 'config/linhas/' + key)); };

        onAuthStateChanged(auth, u => {
            user = u;
            if(u) {
                document.getElementById('auth-area').innerHTML = `<div class="d-flex align-items-center p-2 bg-light rounded-3 shadow-sm mb-3"><img src="${u.photoURL}" width="34" class="rounded-circle me-2"> <div class="flex-grow-1 fw-bold small text-truncate text-start">${u.displayName}</div> <i class="bi bi-box-arrow-right text-muted fs-5 ms-2 cursor-pointer" onclick="window.fazerLogout()"></i></div>`;
                document.getElementById('action-btn').style.display = 'flex';
                if(u.email.toLowerCase().trim() === ADMIN_EMAIL.toLowerCase()) document.getElementById('admin-entry').style.display = 'block';
                const saved = localStorage.getItem('busu_active_line');
                const savedComp = localStorage.getItem('busu_active_company') || 'atlantico';
                if(saved && !watchID) iniciarGPS(saved, savedComp);
            } else {
                document.getElementById('auth-area').innerHTML = `<button class="btn btn-primary w-100 py-2 fw-bold rounded-pill shadow" onclick="window.fazerLogin()"><i class="bi bi-google me-2"></i> Entrar com Google</button>`;
                document.getElementById('action-btn').style.display = 'none';
            }
        });

        onValue(ref(db, 'config/linhas'), snap => {
            const data = snap.val() || {};
            const select = document.getElementById('line-select'), admin = document.getElementById('admin-lines-list-crud'), planning = document.getElementById('planning-all-lines');
            select.innerHTML = ''; admin.innerHTML = ''; planning.innerHTML = '';
            for(let key in data) {
                const c = data[key]; configLinhas[key] = c;
                const compData = COMPANIES[c.company || 'atlantico'];
                select.innerHTML += `<option value="${key}">${c.id} - ${c.nome}</option>`;
                admin.innerHTML += `<div class="list-group-item d-flex justify-content-between align-items-center p-2 small border-bottom cursor-pointer" onclick="window.loadLineForEdit('${key}')"><div><img src="${compData.favicon}" width="14" class="me-2"><span class="fw-bold">${c.id}</span></div><i class="bi bi-trash text-danger" onclick="event.stopPropagation(); window.deleteLine('${key}')"></i></div>`;
                planning.innerHTML += `<div class="nav-item-custom border-bottom" onclick="window.fazeZoom('${key}')"><img src="${compData.favicon}" class="bus-logo-mini"><div><div class="fw-bold">${c.id} - ${c.nome}</div><div class="text-muted" style="font-size:10px">${c.via}</div></div></div>`;
            }
        });

        onValue(ref(db, 'onibus'), snap => {
            const gps = snap.val() || {}, now = Date.now();
            let statusHtml = "", drawerHtml = "", totalGeral = 0;
            const uLat = userMarker ? userMarker.getLatLng().lat : null;
            const uLng = userMarker ? userMarker.getLatLng().lng : null;

            for(let key in configLinhas) {
                const c = configLinhas[key];
                let lt=0, lg=0, ct=0, finalComp = c.company;
                if(gps[key]) {
                    for(let uid in gps[key]) {
                        const info = gps[key][uid];
                        if(now - info.timestamp < 45000) { lt+=info.lat; lg+=info.lng; ct++; finalComp = info.company || c.company; }
                    }
                }
                totalGeral += ct;
                const compData = COMPANIES[finalComp || 'atlantico'];

                if(ct > 0) {
                    const mLat = lt/ct, mLng = lg/ct;
                    if(!markers[key]) {
                        markers[key] = L.marker([mLat, mLng], { icon: L.divIcon({ className:'custom-pin', html:`<div class="bus-pin pulse" style="background:${c.cor}"><img src="${compData.favicon}"></div>`, iconSize:[44,44], iconAnchor:[22,44] }) }).addTo(map).bindPopup(`<b>${c.id} - ${c.nome}</b><br><small>Empresa: ${compData.name}</small>`);
                    }
                    markers[key].setLatLng([mLat, mLng]);
                    
                    const d = uLat ? calcDist(uLat, uLng, mLat, mLng) : null;
                    drawerHtml += `<div class="d-flex align-items-center mb-3" onclick="window.fazeZoom('${key}')" style="cursor:pointer; color: ${c.cor};"><div class="line-dot-pulse active"></div><div style="flex-grow:1"><div class="bus-title" style="color: #202124;"><img src="${compData.favicon}" class="bus-logo-mini">${c.id} - ${c.nome}</div></div></div>`;
                    if (!uLat || d <= 5) {
                        statusHtml += `<div class="bus-item" onclick="window.fazeZoom('${key}')"><div><div class="bus-title"><img src="${compData.favicon}" class="bus-logo-mini">${c.id} - ${c.nome}</div><div class="bus-subtitle">${c.via}</div><div class="bus-dist">${d ? d.toFixed(1) + ' km' : '--'}</div></div><div class="bus-eta">Próximo</div></div>`;
                    }
                } else if(markers[key]) { map.removeLayer(markers[key]); delete markers[key]; }
            }
            document.getElementById('floating-active-list').innerHTML = drawerHtml || '<p class="m-0 text-muted" style="font-size:10px">Nenhuma linha operando.</p>';
            document.getElementById('status-display').innerHTML = statusHtml || '<p class="small text-muted m-0" style="font-size:11px;">Buscando frota ativa...</p>';
            if(totalGeral > 0) { document.getElementById('global-counter').style.display = 'block'; document.getElementById('total-active-text').innerText = `${totalGeral} COLABORADORES ATIVOS`; } else { document.getElementById('global-counter').style.display = 'none'; }
        });

        window.onload = () => { setTimeout(() => window.geoCenter(), 2000); };
    </script>
</body>
</html>
