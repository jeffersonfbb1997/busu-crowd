<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BusU-Crowd - Localizador Universitário</title>
    
    <!-- Bibliotecas Externas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #4285F4;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --sidebar-width: 350px;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: 'Inter', sans-serif; background: #f0f2f5; overflow: hidden;
        }

        /* --- LAYOUT RESPONSIVO --- */
        #app-container { display: flex; height: 100vh; width: 100vw; }

        #map { flex-grow: 1; height: 100%; z-index: 1; }

        /* Sidebar Desktop */
        #sidebar-admin {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            z-index: 1002;
            transition: all 0.3s;
        }

        /* Mobile Adjustments */
        @media (max-width: 991px) {
            #sidebar-admin { display: none; position: fixed; height: 100%; width: 100%; }
            .mobile-hide { display: none !important; }
        }

        /* --- UI COMPONENTES (GOOGLE MAPS STYLE) --- */
        .search-box {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            width: 360px; max-width: calc(100% - 40px);
            background: white; border-radius: 24px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            padding: 8px 16px; display: flex; align-items: center;
        }

        .search-box input { border: none; outline: none; flex-grow: 1; padding: 5px 10px; }

        .info-card-bottom {
            position: absolute; bottom: 90px; left: 20px; right: 20px;
            background: var(--glass-bg); backdrop-filter: blur(10px);
            border-radius: 16px; z-index: 1000; padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
        }

        @media (min-width: 992px) {
            .info-card-bottom { width: 350px; left: auto; right: 20px; bottom: 20px; }
        }

        .bottom-nav {
            position: absolute; bottom: 0; width: 100%; height: 70px;
            background: white; display: flex; justify-content: space-around;
            align-items: center; z-index: 1001; border-top: 1px solid #eee;
        }

        /* --- MARCADORES --- */
        .bus-marker {
            background-color: #7f8c8d;
            border: 2px solid white;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex; align-items: center; justify-content: center;
            color: white; width: 40px !important; height: 40px !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.5s ease;
        }
        .bus-marker span { transform: rotate(45deg); font-size: 18px; }
        .bus-marker.ativo { opacity: 1; filter: none; }
        
        .pulse { animation: pulsing 1.5s infinite; }
        @keyframes pulsing {
            0% { box-shadow: 0 0 0 0 rgba(0,0,0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0,0,0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0,0,0, 0); }
        }
    </style>
</head>
<body>

    <!-- Alerta Geral -->
    <div id="bannerAlerta" class="alert alert-warning text-center fw-bold small" style="display:none; position:fixed; top:0; width:100%; z-index:2000; margin:0; border-radius:0;"></div>

    <div id="app-container">
        <!-- SIDEBAR (Admin / Info) -->
<aside id="sidebar-admin" class="p-3">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold m-0 text-primary">BusU-Crowd</h4>
        <button class="btn btn-light btn-sm d-lg-none" onclick="toggleAdmin()"><i class="bi bi-x-lg"></i></button>
    </div>

    <!-- AREA DO USUÁRIO (LOGIN/PERFIL) -->
    <div id="userInfo">
        <!-- Preenchido pelo JavaScript -->
    </div>
    
    <div class="mb-4">
        <h6 class="text-muted small fw-bold text-uppercase">Linhas Ativas</h6>
        <div id="listaLinhasSidebar" class="list-group list-group-flush"></div>
    </div>

    <!-- BOTÃO ADMIN (Só aparece para você) -->
    <button id="btnConfigAdmin" class="btn btn-dark w-100 mt-auto" style="display:none;" onclick="abrirConfigAdmin()">
        ⚙️ Configurar Linhas
    </button>
</aside>

        <!-- MAPA -->
        <main id="map">
            <!-- Barra de Busca -->
            <div class="search-box">
                <i class="bi bi-list fs-4 me-2 cursor-pointer" onclick="toggleAdmin()"></i>
                <input type="text" placeholder="Para onde você vai?">
                <i class="bi bi-search text-muted"></i>
            </div>

            <!-- Botões Flutuantes -->
            <div style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px;">
                <button class="btn btn-white shadow-sm rounded-circle p-2" onclick="centralizarGps()" style="background:white; width:45px; height:45px;"><i class="bi bi-crosshair"></i></button>
                <button id="btnPrincipal" class="btn btn-primary shadow-lg rounded-circle p-2" data-bs-toggle="modal" data-bs-target="#modalLinhas" style="width:55px; height:55px;"><i class="bi bi-broadcast fs-4"></i></button>
            </div>

            <!-- Card Inferior -->
            <div class="info-card-bottom" id="infoCard">
                <h6 class="fw-bold mb-2 small text-muted">PRÓXIMOS ÔNIBUS</h6>
                <div id="listaProximos">
                    <p class="small text-muted m-0">Nenhum ônibus em movimento no momento.</p>
                </div>
            </div>
        </main>

        <!-- Menu Inferior Mobile -->
        <nav class="bottom-nav d-lg-none">
            <div class="nav-item text-primary"><i class="bi bi-map-fill fs-4"></i></div>
            <div class="nav-item text-muted"><i class="bi bi-heart fs-4"></i></div>
            <div class="nav-item text-muted" onclick="toggleAdmin()"><i class="bi bi-gear-fill fs-4"></i></div>
        </nav>
    </div>

    <!-- MODAL: SELEÇÃO DE LINHA (COLABORAR) -->
    <div class="modal fade" id="modalLinhas" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Transmitir Localização</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="small text-muted">Selecione a linha que você está agora para ajudar outros alunos.</p>
                    <select class="form-select form-select-lg" id="linhaSelecionada"></select>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-success w-100 py-3 fw-bold" id="btnIniciarColaboracao">COMEÇAR AGORA</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: ADMIN (CONFIGURAÇÃO) -->
    <div class="modal fade" id="modalConfigAdmin" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-fullscreen-sm-down">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Gestão de Linhas</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3 mb-4 p-3 bg-light rounded">
                        <div class="col-md-3"><input type="text" id="admID" class="form-control" placeholder="ID (ex: L01)"></div>
                        <div class="col-md-5"><input type="text" id="admNome" class="form-control" placeholder="Nome Completo"></div>
                        <div class="col-md-2"><input type="color" id="admCor" class="form-control form-control-color w-100" value="#4285F4"></div>
                        <div class="col-md-2"><input type="text" id="admIcone" class="form-control" placeholder="🚌"></div>
                        <div class="col-md-5"><input type="number" id="admLat" class="form-control" placeholder="Lat Terminal" step="any"></div>
                        <div class="col-md-5"><input type="number" id="admLng" class="form-control" placeholder="Lng Terminal" step="any"></div>
                        <div class="col-md-2"><button class="btn btn-info w-100" onclick="pegarLocalizacaoAdmin()">📍</button></div>
                        <div class="col-12"><button class="btn btn-primary w-100" onclick="salvarLinha()">SALVAR LINHA</button></div>
                    </div>
                    <h6>Linhas Cadastradas:</h6>
                    <div id="listaAdminEdicao" class="list-group"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";
    // ADICIONADO: Módulo de Autenticação
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB7qohXZb_DYFplLOtt5YiqbahwhNYGPck",
        authDomain: "busu-crowd.firebaseapp.com",
        projectId: "busu-crowd",
        storageBucket: "busu-crowd.firebasestorage.app",
        messagingSenderId: "48985646106",
        appId: "1:48985646106:web:1c7b80091855ad01609da3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // --- CONFIGURAÇÃO DE ACESSO ---
    const ADMIN_EMAIL = "seu-email@gmail.com"; // SUBSTITUA PELO SEU E-MAIL

    let usuarioLogado = null;
    let watchID = null;
    let linhaAtiva = null;

    // --- LÓGICA DE LOGIN ---
    window.fazerLogin = () => {
        signInWithPopup(auth, provider).catch(error => alert("Erro ao logar: " + error.message));
    };

    window.fazerLogout = () => {
        signOut(auth).then(() => location.reload());
    };

    // Observador de Autenticação (Roda sempre que o status do usuário muda)
    onAuthStateChanged(auth, (user) => {
        const btnPrincipal = document.getElementById('btnPrincipal');
        const sidebar = document.getElementById('sidebar-admin');
        
        if (user) {
            usuarioLogado = user;
            // Atualiza interface para logado
            btnPrincipal.style.display = "block"; // Mostra botão de transmitir
            
            // Verifica se é ADMIN
            if (user.email === ADMIN_EMAIL) {
                document.getElementById('btnConfigAdmin').style.display = "block";
                console.log("Acesso Admin Liberado");
            }

            // Atualiza Sidebar com foto e nome
            document.getElementById('userInfo').innerHTML = `
                <div class="d-flex align-items-center mb-3 p-2 bg-light rounded">
                    <img src="${user.photoURL}" class="rounded-circle me-2" width="35">
                    <div class="small">
                        <div class="fw-bold text-truncate" style="max-width:150px;">${user.displayName}</div>
                        <a href="#" onclick="fazerLogout()" class="text-danger decoration-none" style="font-size:10px">Sair</a>
                    </div>
                </div>
            `;
        } else {
            usuarioLogado = null;
            btnPrincipal.style.display = "none"; // Esconde botão se não logado
            document.getElementById('btnConfigAdmin').style.display = "none";
            document.getElementById('userInfo').innerHTML = `
                <button class="btn btn-outline-primary btn-sm w-100 mb-3" onclick="fazerLogin()">
                    <i class="bi bi-google me-2"></i> Entrar com Google
                </button>
            `;
        }
    });

</script>
</body>
</html>
