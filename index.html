<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BusU-Crowd</title>
    
    <!-- Bibliotecas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --blue: #4285F4; --sidebar-z: 1100; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Inter', sans-serif; overflow: hidden; background: #eee; }

        /* Mapa ocupa a tela toda */
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* Sidebar Inteligente */
        #sidebar { 
            position: fixed; left: 0; top: 0; bottom: 0; width: 300px; 
            background: white; z-index: var(--sidebar-z); transition: transform 0.3s ease;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column;
        }
        @media (max-width: 991px) { #sidebar { transform: translateX(-100%); width: 280px; } #sidebar.active { transform: translateX(0); } }

        /* Overlay para fechar sidebar no mobile */
        #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1050; }
        #sidebar-overlay.active { display: block; }

        /* Elementos Flutuantes (Google Style) */
        .search-container { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 1000; pointer-events: none; }
        .search-bar { 
            max-width: 400px; background: white; border-radius: 24px; padding: 8px 16px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.2); display: flex; align-items: center; pointer-events: auto;
        }
        .search-bar input { border: none; outline: none; flex-grow: 1; margin-left: 10px; font-size: 15px; }

        .floating-controls { position: absolute; bottom: 100px; right: 15px; z-index: 1000; display: flex; flex-direction: column; gap: 12px; }
        .btn-float { 
            width: 50px; height: 50px; border-radius: 50%; background: white; border: none; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #555;
        }
        .btn-float.active { background: #d93025; color: white; animation: pulse-red 1.5s infinite; }

        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(217, 48, 37, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(217, 48, 37, 0); } 100% { box-shadow: 0 0 0 0 rgba(217, 48, 37, 0); } }

        .info-card { 
            position: absolute; bottom: 20px; left: 15px; right: 15px; max-width: 400px;
            background: white; border-radius: 16px; padding: 15px; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 1px solid #eee;
        }

        /* Marcadores do Mapa */
        .bus-pin { 
            width: 40px; height: 40px; background: #7f8c8d; border: 3px solid white; 
            border-radius: 50% 50% 50% 0; transform: rotate(-45deg); 
            display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        .bus-pin span { transform: rotate(45deg); font-size: 18px; }
    </style>
</head>
<body>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="p-3">
        <h4 class="fw-bold text-primary mb-3">BusU-Crowd</h4>
        
        <div id="auth-section" class="mb-4">
            <!-- Botão Login será injetado aqui -->
        </div>

        <div class="flex-grow-1 overflow-auto">
            <h6 class="text-muted small fw-bold text-uppercase">Linhas Ativas</h6>
            <div id="sidebar-lines" class="list-group list-group-flush"></div>
        </div>

        <button id="admin-btn" class="btn btn-dark w-100 mt-2" style="display:none" onclick="openAdmin()">⚙️ Configurações</button>
    </aside>

    <main id="map">
        <!-- Barra de Busca -->
        <div class="search-container">
            <div class="search-bar">
                <i class="bi bi-list fs-4 cursor-pointer" onclick="toggleSidebar()"></i>
                <input type="text" placeholder="Para onde você vai?">
            </div>
        </div>

        <!-- Controles Flutuantes -->
        <div class="floating-controls">
            <button class="btn-float" onclick="geoCenter()"><i class="bi bi-crosshair"></i></button>
            <button id="main-action-btn" class="btn-float" style="display:none" onclick="handleBroadcastClick()">
                <i id="broadcast-icon" class="bi bi-broadcast"></i>
            </button>
        </div>

        <!-- Card Inferior -->
        <div class="info-card">
            <h6 class="fw-bold small text-muted text-uppercase mb-2">Próximos Ônibus</h6>
            <div id="arrival-list"><p class="small text-muted m-0">Acesse para ver ônibus em tempo real.</p></div>
        </div>
    </main>

    <!-- Modais -->
    <div class="modal fade" id="modalSelectBus" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0"><div class="modal-header"><h5>Qual linha você está?</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><select id="bus-select" class="form-select form-select-lg"></select></div><div class="modal-footer"><button class="btn btn-primary w-100" onclick="startTracking()">INICIAR TRANSMISSÃO</button></div></div></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7qohXZb_DYFplLOtt5YiqbahwhNYGPck",
            authDomain: "busu-crowd.firebaseapp.com",
            projectId: "busu-crowd",
            storageBucket: "busu-crowd.firebasestorage.app",
            messagingSenderId: "48985646106",
            appId: "1:48985646106:web:1c7b80091855ad01609da3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "jeffersonfbb1997@gmail.com";
        const map = L.map('map', { zoomControl: false }).setView([-14.7981, -39.0347], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let currentUser = null;
        let activeWatch = null;
        let activeLine = null;
        const busMarkers = {};
        const lineConfig = {};

        // --- FUNÇÕES GLOBAIS ---
        window.toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        };

        window.geoCenter = () => {
            navigator.geolocation.getCurrentPosition(p => map.flyTo([p.coords.latitude, p.coords.longitude], 16));
        };

        window.handleBroadcastClick = () => {
            if (activeWatch) {
                stopTracking();
            } else {
                new bootstrap.Modal(document.getElementById('modalSelectBus')).show();
            }
        };

        window.fazerLogin = () => signInWithPopup(auth, provider);
        window.fazerLogout = () => signOut(auth).then(() => location.reload());

        window.startTracking = () => {
            const line = document.getElementById('bus-select').value;
            if(!line) return;
            activeLine = line;
            bootstrap.Modal.getInstance(document.getElementById('modalSelectBus')).hide();

            activeWatch = navigator.geolocation.watchPosition(p => {
                const path = `onibus/${line}/${currentUser.uid}`;
                set(ref(db, path), { lat: p.coords.latitude, lng: p.coords.longitude, timestamp: Date.now() });
                onDisconnect(ref(db, path)).remove();
                
                // Visual Button State
                const btn = document.getElementById('main-action-btn');
                btn.classList.add('active');
                document.getElementById('broadcast-icon').classList.replace('bi-broadcast', 'bi-stop-circle');
            }, e => alert("GPS Error: " + e.message), { enableHighAccuracy: true });
        };

        function stopTracking() {
            if (activeWatch) {
                navigator.geolocation.clearWatch(activeWatch);
                remove(ref(db, `onibus/${activeLine}/${currentUser.uid}`));
                activeWatch = null;
                const btn = document.getElementById('main-action-btn');
                btn.classList.remove('active');
                document.getElementById('broadcast-icon').classList.replace('bi-stop-circle', 'bi-broadcast');
                alert("Transmissão encerrada.");
            }
        }

        // --- AUTH OBSERVER ---
        onAuthStateChanged(auth, user => {
            currentUser = user;
            const authSection = document.getElementById('auth-section');
            const mainBtn = document.getElementById('main-action-btn');

            if (user) {
                authSection.innerHTML = `<div class="d-flex align-items-center p-2 border rounded"><img src="${user.photoURL}" width="35" class="rounded-circle me-2"> <div class="small flex-grow-1 text-truncate">${user.displayName}</div> <i class="bi bi-box-arrow-right text-danger ms-2 cursor-pointer" onclick="window.fazerLogout()"></i></div>`;
                mainBtn.style.display = 'flex';
                if (user.email === ADMIN_EMAIL) document.getElementById('admin-btn').style.display = 'block';
            } else {
                authSection.innerHTML = `<button class="btn btn-primary w-100" onclick="window.fazerLogin()"><i class="bi bi-google me-2"></i> Entrar com Google</button>`;
                mainBtn.style.display = 'none';
            }
        });

        // --- DATA SYNC ---
        onValue(ref(db, 'config/linhas'), snapshot => {
            const data = snapshot.val() || {};
            const sidebarLines = document.getElementById('sidebar-lines');
            const busSelect = document.getElementById('bus-select');
            sidebarLines.innerHTML = '';
            busSelect.innerHTML = '';

            for (let id in data) {
                const c = data[id];
                lineConfig[id] = c;
                sidebarLines.innerHTML += `<div class="list-group-item d-flex align-items-center border-0"><div style="background:${c.cor}; width:12px; height:12px; border-radius:50%; margin-right:10px;"></div> ${c.nome}</div>`;
                busSelect.innerHTML += `<option value="${id}">${c.nome}</option>`;

                if (!busMarkers[id]) {
                    const icon = L.divIcon({ className: 'custom-pin', html: `<div class="bus-pin" id="pin-${id}"><span>${c.icone}</span></div>`, iconSize:[40,40], iconAnchor:[20,40] });
                    busMarkers[id] = L.marker([c.latTerminal, c.lngTerminal], {icon: icon}).addTo(map);
                    busMarkers[id].bindPopup(c.nome);
                }
            }
        });

        onValue(ref(db, 'onibus'), snapshot => {
            const gpsData = snapshot.val() || {};
            const now = Date.now();
            let arrivalHtml = "";

            for (let lineId in lineConfig) {
                const c = lineConfig[lineId];
                const marker = busMarkers[lineId];
                let sLat = 0, sLng = 0, count = 0;

                if (gpsData[lineId]) {
                    for (let uid in gpsData[lineId]) {
                        const info = gpsData[lineId][uid];
                        if (now - info.timestamp < 40000) { sLat += info.lat; sLng += info.lng; count++; }
                    }
                }

                const pinElement = document.getElementById(`pin-${lineId}`);
                if (count > 0) {
                    marker.setLatLng([sLat/count, sLng/count]);
                    if (pinElement) { pinElement.style.backgroundColor = c.cor; pinElement.classList.add('pulse'); }
                    arrivalHtml += `<div class="d-flex justify-content-between align-items-center mb-2"><span>${c.icone} ${c.nome}</span> <span class="badge bg-success">EM MOVIMENTO (${count})</span></div>`;
                } else {
                    marker.setLatLng([c.latTerminal, c.lngTerminal]);
                    if (pinElement) { pinElement.style.backgroundColor = "#7f8c8d"; pinElement.classList.remove('pulse'); }
                }
            }
            document.getElementById('arrival-list').innerHTML = arrivalHtml || '<p class="small text-muted m-0">Aguardando sinais...</p>';
        });
    </script>
</body>
</html>
