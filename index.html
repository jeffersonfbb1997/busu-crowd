<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BusU-Crowd</title>
    
    <!-- Bibliotecas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <style>

        /* Marcador de Localização do Usuário (O Boneco) */
.user-marker {
    width: 20px;
    height: 20px;
    background: #4285F4; /* Azul Google */
    border: 3px solid white;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Efeito de Ondas Azuis (Pulsação) */
.user-marker::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(66, 133, 244, 0.4);
    animation: user-pulse 2s infinite;
    z-index: -1;
}

@keyframes user-pulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
}

/* Ícone do Boneco dentro do círculo */
.user-marker i {
    font-size: 10px;
    color: white;
}
        
        :root { --blue: #1a73e8; --sidebar-w: 320px; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Inter', sans-serif; overflow: hidden; background: #e5e3df; }

        /* Mapa */
        #map { position: absolute; inset: 0; z-index: 1; }

        /* Sidebar Estilo Google Maps */
        #sidebar { 
            position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w); 
            background: white; z-index: 2000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; transform: translateX(-100%);
            box-shadow: 5px 0 15px rgba(0,0,0,0.1);
        }
        #sidebar.active { transform: translateX(0); }
        
        #sidebar-overlay { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 1900; 
        }
        #sidebar-overlay.active { display: block; }

        /* Submenus da Sidebar */
        .sidebar-view { display: none; flex-direction: column; height: 100%; width: 100%; padding: 20px; }
        .sidebar-view.active { display: flex; }

        /* Busca Centralizada */
        .top-ui { position: absolute; top: 15px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 1000; pointer-events: none; }
        .search-bar { 
            width: 90%; max-width: 420px; background: white; border-radius: 24px; padding: 8px 16px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.2); display: flex; align-items: center; pointer-events: auto;
        }
        .search-bar input { border: none; outline: none; flex-grow: 1; margin: 0 10px; font-size: 15px; }

        /* Card Inferior */
        .bottom-ui { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 1000; pointer-events: none; }
        .info-card { 
            width: 90%; max-width: 380px; background: white; border-radius: 16px; padding: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); pointer-events: auto;
        }

        /* Botões Flutuantes */
        .side-btns { position: absolute; right: 15px; bottom: 160px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .btn-circle { 
            width: 50px; height: 50px; border-radius: 50%; background: white; border: none; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #5f6368;
        }
        .btn-circle.active { background: #d93025; color: white; animation: pulse-red 1.5s infinite; }

        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(217, 48, 37, 0.6); } 70% { box-shadow: 0 0 0 12px rgba(217, 48, 37, 0); } 100% { box-shadow: 0 0 0 0 rgba(217, 48, 37, 0); } }

        /* Pins do Ônibus */
        .bus-pin { 
            width: 40px; height: 40px; background: #7f8c8d; border: 2px solid white; 
            border-radius: 50% 50% 50% 0; transform: rotate(-45deg); 
            display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .bus-pin span { transform: rotate(45deg); font-size: 18px; }
    </style>
</head>
<body>


    <div id="sidebar-overlay" onclick="window.toggleSidebar()"></div>

    <!-- SIDEBAR ÚNICA -->
    <aside id="sidebar">
        <!-- VISTA 1: MENU PRINCIPAL -->
        <div id="view-main" class="sidebar-view active">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold text-primary m-0">BusU-Crowd</h4>
                <i class="bi bi-x-lg cursor-pointer" onclick="window.toggleSidebar()"></i>
            </div>
            
            <div id="auth-area" class="mb-4"></div>

            <div class="flex-grow-1 overflow-auto">
                <h6 class="text-muted small fw-bold text-uppercase mb-3">Linhas Cadastradas</h6>
                <div id="line-list-sidebar" class="list-group list-group-flush"></div>
            </div>

            <div id="admin-only-btn" style="display:none">
                <hr>
                <button class="btn btn-dark w-100 py-2 fw-bold" onclick="window.switchView('admin')">
                    <i class="bi bi-sliders me-2"></i> Configurações
                </button>
            </div>
        </div>

        <!-- VISTA 2: PAINEL ADMIN INTEGRADO -->
        <div id="view-admin" class="sidebar-view">
            <div class="d-flex align-items-center mb-4">
                <i class="bi bi-arrow-left fs-4 cursor-pointer me-3" onclick="window.switchView('main')"></i>
                <h5 class="fw-bold m-0">Gerenciar Linhas</h5>
            </div>

            <div class="card card-body border-0 bg-light mb-3">
                <input type="text" id="admID" class="form-control mb-2" placeholder="ID (ex: L01)">
                <input type="text" id="admNome" class="form-control mb-2" placeholder="Nome da Linha">
                <div class="d-flex gap-2 mb-2">
                    <input type="color" id="admCor" class="form-control form-control-color flex-grow-1" value="#1a73e8">
                    <input type="text" id="admIcone" class="form-control w-50" placeholder="🚌">
                </div>
                <button class="btn btn-primary w-100 fw-bold" onclick="window.saveLine()">SALVAR ALTERAÇÕES</button>
            </div>

            <div id="admin-lines-edit" class="list-group list-group-flush overflow-auto"></div>
        </div>
    </aside>

    <main id="map">
        <div class="top-ui">
            <div class="search-bar">
                <i class="bi bi-list fs-3 cursor-pointer" onclick="window.toggleSidebar()"></i>
                <input type="text" placeholder="Para onde você vai?">
                <i class="bi bi-search text-muted"></i>
            </div>
        </div>

        <div class="side-btns">
            <button class="btn-circle" onclick="window.geoCenter()"><i class="bi bi-crosshair"></i></button>
            <button id="action-btn" class="btn-circle" style="display:none" onclick="window.onActionClick()">
                <i id="action-icon" class="bi bi-broadcast"></i>
            </button>
        </div>

        <div class="bottom-ui">
            <div class="info-card">
                <h6 class="fw-bold small text-muted text-uppercase mb-2">Próximos Ônibus</h6>
                <div id="status-list"><p class="small text-muted m-0">Entre para ver ônibus ativos.</p></div>
            </div>
        </div>
    </main>

    <!-- Modal Seleção de Linha (Único Modal Restante) -->
    <div class="modal fade" id="modalLine" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered px-4">
            <div class="modal-content border-0 shadow-lg" style="border-radius:20px">
                <div class="modal-body p-4 text-center">
                    <h5 class="fw-bold mb-3">Qual linha você está?</h5>
                    <select id="line-select" class="form-select form-select-lg mb-4"></select>
                    <button class="btn btn-primary w-100 py-3 fw-bold rounded-pill" onclick="window.startTrack()">COMEÇAR TRANSMISSÃO</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7qohXZb_DYFplLOtt5YiqbahwhNYGPck",
            authDomain: "busu-crowd.firebaseapp.com",
            projectId: "busu-crowd",
            storageBucket: "busu-crowd.firebasestorage.app",
            messagingSenderId: "48985646106",
            appId: "1:48985646106:web:1c7b80091855ad01609da3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "jeffersonfbb1997@gmail.com";
        const map = L.map('map', { zoomControl: false }).setView([-14.7981, -39.0347], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let user = null;
        let watchID = null;
        let currentLine = null;
        const markers = {};
        const configLinhas = {};

        // --- GLOBAL FUNCTIONS ---
        window.toggleSidebar = () => {
            const active = document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebar-overlay').classList.toggle('active');
            if(!active) window.switchView('main');
        };

        window.switchView = (view) => {
            document.querySelectorAll('.sidebar-view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + view).classList.add('active');
        };

       let userMarker = null; // Variável global para o marcador do aluno

    window.geoCenter = () => {
    if (!navigator.geolocation) return alert("GPS não suportado");

    navigator.geolocation.getCurrentPosition(p => {
        const lat = p.coords.latitude;
        const lng = p.coords.longitude;

        // Move o mapa para a sua posição
        map.flyTo([lat, lng], 17);

        // Se o boneco já existe, apenas move ele. Se não, cria um novo.
        if (userMarker) {
            userMarker.setLatLng([lat, lng]);
        } else {
            const userIcon = L.divIcon({
                className: 'user-marker',
                html: '<i class="bi bi-person-fill"></i>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            
            userMarker = L.marker([lat, lng], { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
            userMarker.bindPopup("<b>Você está aqui</b>");
        }
    }, (err) => {
        alert("Erro ao obter sua localização. Verifique se o GPS está ativo.");
    }, { enableHighAccuracy: true });
};

        window.startTrack = () => {
            const line = document.getElementById('line-select').value;
            currentLine = line;
            bootstrap.Modal.getInstance(document.getElementById('modalLine')).hide();
            watchID = navigator.geolocation.watchPosition(p => {
                const path = `onibus/${line}/${user.uid}`;
                set(ref(db, path), { lat: p.coords.latitude, lng: p.coords.longitude, timestamp: Date.now() });
                onDisconnect(ref(db, path)).remove();
                document.getElementById('action-btn').classList.add('active');
                document.getElementById('action-icon').className = 'bi bi-stop-circle-fill';
            }, null, {enableHighAccuracy:true});
        };

        window.stopTrack = () => {
            navigator.geolocation.clearWatch(watchID);
            remove(ref(db, `onibus/${currentLine}/${user.uid}`));
            watchID = null;
            document.getElementById('action-btn').classList.remove('active');
            document.getElementById('action-icon').className = 'bi bi-broadcast';
        };

        window.saveLine = () => {
            const id = document.getElementById('admID').value;
            if(!id) return;
            set(ref(db, 'config/linhas/' + id), {
                nome: document.getElementById('admNome').value,
                cor: document.getElementById('admCor').value,
                icone: document.getElementById('admIcone').value || "🚌",
                latTerminal: -14.7981, lngTerminal: -39.0347
            });
            alert("Salvo!");
        };

        window.deleteLine = (id) => { if(confirm("Apagar?")) remove(ref(db, 'config/linhas/' + id)); };

        // --- AUTH ---
        onAuthStateChanged(auth, u => {
            user = u;
            const authDiv = document.getElementById('auth-area');
            if(u) {
                authDiv.innerHTML = `<div class="d-flex align-items-center p-2 bg-light rounded"><img src="${u.photoURL}" width="32" class="rounded-circle me-2"> <small class="fw-bold flex-grow-1">${u.displayName}</small> <i class="bi bi-box-arrow-right text-danger cursor-pointer" onclick="window.fazerLogout()"></i></div>`;
                document.getElementById('action-btn').style.display = 'flex';
                if(u.email === ADMIN_EMAIL) document.getElementById('admin-only-btn').style.display = 'block';
            } else {
                authDiv.innerHTML = `<button class="btn btn-primary w-100 py-2 fw-bold" onclick="window.fazerLogin()"><i class="bi bi-google me-2"></i> Entrar com Google</button>`;
            }
        });

        // --- DATA ---
        onValue(ref(db, 'config/linhas'), snap => {
            const data = snap.val() || {};
            const list = document.getElementById('line-list-sidebar');
            const select = document.getElementById('line-select');
            const editList = document.getElementById('admin-lines-edit');
            list.innerHTML = ''; select.innerHTML = ''; editList.innerHTML = '';

            for(let id in data) {
                const c = data[id];
                configLinhas[id] = c;
                list.innerHTML += `<div class="list-group-item d-flex align-items-center border-0 px-0 small"><div style="background:${c.cor};width:10px;height:10px;border-radius:50%;margin-right:10px;"></div>${c.nome}</div>`;
                select.innerHTML += `<option value="${id}">${c.nome}</option>`;
                editList.innerHTML += `<div class="list-group-item d-flex justify-content-between p-2 small">${c.nome} <i class="bi bi-trash text-danger cursor-pointer" onclick="window.deleteLine('${id}')"></i></div>`;

                if(!markers[id]) {
                    const icon = L.divIcon({ className:'custom-pin', html:`<div class="bus-pin" id="pin-${id}"><span>${c.icone}</span></div>`, iconSize:[40,40], iconAnchor:[20,40] });
                    markers[id] = L.marker([c.latTerminal, c.lngTerminal], {icon:icon}).addTo(map).bindPopup(c.nome);
                }
            }
        });

        onValue(ref(db, 'onibus'), snap => {
            const gps = snap.val() || {};
            const now = Date.now();
            let html = "";
            for(let id in configLinhas) {
                const c = configLinhas[id];
                const marker = markers[id];
                let lat=0, lng=0, count=0;
                if(gps[id]) {
                    for(let uid in gps[id]) {
                        const info = gps[id][uid];
                        if(now - info.timestamp < 45000) { lat+=info.lat; lng+=info.lng; count++; }
                    }
                }
                const pin = document.getElementById(`pin-${id}`);
                if(count > 0) {
                    marker.setLatLng([lat/count, lng/count]);
                    if(pin) { pin.style.background = c.cor; pin.classList.add('pulse'); }
                    html += `<div class="d-flex justify-content-between mb-1 small fw-bold"><span>${c.icone} ${c.nome}</span> <span class="text-success">ATIVO (${count})</span></div>`;
                } else {
                    marker.setLatLng([c.latTerminal, c.lngTerminal]);
                    if(pin) { pin.style.background = "#7f8c8d"; pin.classList.remove('pulse'); }
                }
            }
            document.getElementById('status-list').innerHTML = html || '<p class="small text-muted m-0">Nenhum ônibus em movimento.</p>';
        });
    </script>
</body>
</html>
