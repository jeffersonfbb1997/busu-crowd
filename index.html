<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BusU-Crowd</title>
    
    <!-- Bibliotecas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --blue: #1a73e8; --sidebar-w: 300px; --z-ui: 4000; --green: #34a853; --gray: #70757a; --red: #ea4335; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Inter', sans-serif; overflow: hidden; background: #e5e3df; }
        #map { position: absolute; inset: 0; z-index: 1; }

        /* Sidebar Style */
        #sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w); background: white; z-index: 5000; transition: transform 0.3s ease; display: flex; flex-direction: column; transform: translateX(-100%); box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
        #sidebar.active { transform: translateX(0); }
        #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 4500; backdrop-filter: blur(2px); }
        #sidebar-overlay.active { display: block; }
        .sidebar-view { display: none; flex-direction: column; height: 100%; width: 100%; padding: 20px; overflow-y: auto; }
        .sidebar-view.active { display: flex; }

        /* Títulos de Seção */
        .section-header { display: flex; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #f1f3f4; padding-bottom: 15px; }
        .section-title { font-weight: 800; font-size: 16px; color: #202124; letter-spacing: -0.5px; margin: 0; }

        /* Estilo LED Green */
        .active-label { font-size: 9px; color: var(--green); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; }
        .active-label::before { content: ''; width: 5px; height: 5px; background: var(--green); border-radius: 50%; margin-right: 6px; box-shadow: 0 0 6px var(--green); animation: blink 1.2s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* UI Flutuante */
        .menu-trigger { position: absolute; top: 15px; left: 15px; z-index: var(--z-ui); width: 44px; height: 44px; border-radius: 50%; background: white; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #5f6368; cursor: pointer; }

        /* Card Superior */
        #lines-drawer { position: absolute; top: 70px; left: 15px; z-index: var(--z-ui); width: 220px; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); transition: 0.3s; max-height: 40vh; overflow: hidden; border: 1px solid white; }
        #lines-drawer.collapsed { width: 44px; height: 44px; border-radius: 50%; }
        #lines-drawer.collapsed .active-label, #lines-drawer.collapsed #floating-active-list { display: none; }

        /* Card Inferior Slim */
        .bottom-ui { position: absolute; bottom: 15px; left: 0; width: 100%; display: flex; justify-content: center; z-index: var(--z-ui); pointer-events: none; }
        .info-card { width: 92%; max-width: 340px; background: white; border-radius: 20px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); pointer-events: auto; transition: all 0.4s ease; overflow: hidden; }
        .info-card.minimized { height: 42px; padding-top: 13px; }
        .info-card.minimized #status-display, .info-card.minimized #global-counter { display: none; }

        /* Hierarquia de Texto nos Cards */
        .bus-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; cursor: pointer; }
        .bus-title { font-weight: 700; color: #202124; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bus-subtitle { font-size: 10px; color: var(--gray); font-weight: 500; margin-top: -2px; }
        .bus-eta { font-size: 11px; color: var(--green); font-weight: 800; background: #e6f4ea; padding: 1px 6px; border-radius: 4px; }
        .bus-dist { font-size: 9px; color: var(--gray); font-weight: 600; margin-top: 2px; }

        /* Pontos Pulsantes */
        .line-dot-pulse { width: 6px; height: 6px; border-radius: 50%; margin-right: 10px; position: relative; flex-shrink: 0; }
        .line-dot-pulse.active::after { content: ''; position: absolute; inset: -3px; border: 1px solid currentColor; border-radius: 50%; animation: ring-pulse 1.5s infinite; }
        @keyframes ring-pulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }

        /* Botões Direita */
        .side-btns { position: absolute; right: 15px; bottom: 160px; z-index: var(--z-ui); display: flex; flex-direction: column; gap: 10px; }
        .btn-circle { width: 50px; height: 50px; border-radius: 50%; background: white; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #5f6368; cursor: pointer; }
        .btn-circle.active { background: var(--red) !important; color: white !important; animation: pulse-red 1.5s infinite; }

        .bus-pin { width: 42px; height: 42px; border: 2.5px solid white; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .bus-pin span { transform: rotate(45deg); font-size: 15px; font-weight: 800; }
        .user-marker-icon { background: var(--blue); width: 14px; height: 14px; border: 2.5px solid white; border-radius: 50%; box-shadow: 0 0 8px var(--blue); }
        
        .nav-item-custom { display: flex; align-items: center; padding: 12px; border-radius: 12px; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-size: 13px; font-weight: 500; transition: 0.2s; }
        .nav-item-custom:hover { background: #f8f9fa; color: var(--blue); }
    </style>
</head>
<body>

    <div id="sidebar-overlay" onclick="window.toggleSidebar()"></div>

    <aside id="sidebar">
        <!-- USUÁRIO -->
        <div id="view-main" class="sidebar-view active">
            <div class="section-header">
                <h5 class="section-title text-primary">BusU-Crowd</h5>
                <i class="bi bi-x-lg cursor-pointer ms-auto fs-5" onclick="window.toggleSidebar()"></i>
            </div>
            <div id="auth-area" class="mb-4"></div>
            <nav>
                <button class="nav-item-custom" onclick="window.toggleSidebar()"><i class="bi bi-map text-primary me-3 fs-5"></i> Mapa em Tempo Real</button>
                <button class="nav-item-custom"><i class="bi bi-star text-warning me-3 fs-5"></i> Paradas Favoritas <span class="standby-badge">Standby</span></button>
                <button class="nav-item-custom" onclick="window.switchView('planning')"><i class="bi bi-signpost-split text-success me-3 fs-5"></i> Planejar Rota</button>
                <button class="nav-item-custom"><i class="bi bi-award text-danger me-3 fs-5"></i> Contribuições <span class="standby-badge">Standby</span></button>
                <button class="nav-item-custom"><i class="bi bi-trophy text-info me-3 fs-5"></i> Ranking <span class="standby-badge">Standby</span></button>
                <button class="nav-item-custom"><i class="bi bi-gear text-secondary me-3 fs-5"></i> Configurações <span class="standby-badge">Standby</span></button>
            </nav>
            <div id="admin-entry" style="display:none" class="mt-auto">
                <hr><button class="btn btn-dark w-100 py-2 fw-bold text-uppercase" style="font-size:11px" onclick="window.switchView('admin-dashboard')">⚙️ Painel Administrativo</button>
            </div>
        </div>

        <!-- ADMIN -->
        <div id="view-admin-dashboard" class="sidebar-view">
            <div class="section-header">
                <i class="bi bi-arrow-left fs-4 cursor-pointer me-3 text-primary" onclick="window.switchView('main')"></i>
                <h6 class="section-title">Painel Administrativo</h6>
            </div>
            <div class="row g-2 mb-4">
                <div class="col-6"><div class="card bg-light p-2 text-center border-0 rounded-3"><div class="h5 fw-bold text-primary mb-0" id="stat-users">0</div><small style="font-size:9px" class="text-muted text-uppercase">Ativos</small></div></div>
                <div class="col-6"><div class="card bg-light p-2 text-center border-0 rounded-3"><div class="h5 fw-bold text-primary mb-0" id="stat-lines">0</div><small style="font-size:9px" class="text-muted text-uppercase">Linhas</small></div></div>
            </div>
            <nav>
                <button class="nav-item-custom" onclick="window.switchView('admin-lines')"><i class="bi bi-signpost-2 text-primary me-3"></i> Gestão de Linhas</button>
                <div class="ps-2 py-2 text-muted" style="font-size:11px; opacity:0.6">
                    <div class="mb-2"><i class="bi bi-geo-alt me-3"></i> Paradas (Standby)</div>
                    <div class="mb-2"><i class="bi bi-clock me-3"></i> Horários (Standby)</div>
                    <div class="mb-2"><i class="bi bi-people me-3"></i> Usuários (Standby)</div>
                    <div class="mb-2"><i class="bi bi-bell me-3"></i> Alertas (Standby)</div>
                </div>
            </nav>
        </div>

        <!-- CRUD LINHAS -->
        <div id="view-admin-lines" class="sidebar-view">
            <div class="section-header">
                <i class="bi bi-arrow-left fs-4 cursor-pointer me-3 text-primary" onclick="window.switchView('admin-dashboard')"></i>
                <h6 class="section-title">Gestão de Linhas</h6>
            </div>
            <div class="card card-body border-0 bg-light mb-3 shadow-sm p-3">
                <div class="d-flex justify-content-between mb-2"><small class="fw-bold text-muted text-uppercase" style="font-size:9px">Cadastrar / Editar</small><button class="btn btn-link btn-sm p-0 text-decoration-none" style="font-size:10px" onclick="window.clearAdminForm()">Limpar Novo</button></div>
                <input type="text" id="admID" class="form-control form-control-sm mb-2" placeholder="ID (ex: 203)">
                <input type="text" id="admNome" class="form-control form-control-sm mb-2" placeholder="Nome da Linha">
                <input type="text" id="admVia" class="form-control form-control-sm mb-2" placeholder="Via / Trajeto">
                <!-- Seletor de Cor com Botão Random -->
                <div class="d-flex gap-2 mb-3 align-items-center">
                    <input type="color" id="admCor" class="form-control form-control-color border-0 shadow-sm" value="#1a73e8" style="height:38px; flex:1">
                    <button class="btn btn-white btn-sm shadow-sm border" onclick="window.randomizeColorInput()" style="height:38px; width:45px" title="Cor Aleatória"><i class="bi bi-shuffle"></i></button>
                    <input type="text" id="admIcone" class="form-control form-control-sm w-25 border-0 shadow-sm" style="height:38px" placeholder="🚌">
                </div>
                <button id="btn-save-line" class="btn btn-primary btn-sm w-100 fw-bold shadow-sm" onclick="window.saveLine()">SALVAR ALTERAÇÕES</button>
            </div>
            <h6 class="fw-bold text-muted text-uppercase mb-2" style="font-size:9px">Linhas (Clique para editar)</h6>
            <div id="admin-lines-list-crud" class="list-group list-group-flush"></div>
        </div>

        <!-- PLANEJAR ROTA -->
        <div id="view-planning" class="sidebar-view">
            <div class="section-header">
                <i class="bi bi-arrow-left fs-4 cursor-pointer me-3 text-primary" onclick="window.switchView('main')"></i>
                <h6 class="section-title">Planejar Rota</h6>
            </div>
            <div id="planning-all-lines" class="list-group list-group-flush"></div>
        </div>
    </aside>

    <!-- UI FLUTUANTE -->
    <button class="menu-trigger" onclick="window.toggleSidebar()"><i class="bi bi-list"></i></button>

    <div id="lines-drawer" class="p-3 shadow">
        <div class="d-flex justify-content-between align-items-center mb-3" onclick="window.toggleDrawer()" style="cursor:pointer">
            <span class="active-label">LINHAS ATIVAS</span>
            <i class="bi bi-chevron-up text-muted" style="font-size:12px" id="drawer-icon"></i>
        </div>
        <div id="floating-active-list"></div>
    </div>

    <div class="side-btns">
        <button class="btn-circle shadow" onclick="window.geoCenter()"><i class="bi bi-crosshair"></i></button>
        <button id="action-btn" class="btn-circle shadow" style="display:none" onclick="window.onActionClick()"><i id="action-icon" class="bi bi-broadcast"></i></button>
        <button class="btn-circle shadow" onclick="alert('Funcionalidade disponível em breve!')"><i class="bi bi-eye"></i></button>
    </div>

    <div class="bottom-ui">
        <div class="info-card shadow-lg" id="bottom-info-card">
            <div class="d-flex justify-content-between align-items-center" onclick="window.toggleBottomCard()" style="cursor:pointer; height: 18px;">
                <span class="active-label">STATUS EM TEMPO REAL • 5KM</span>
                <i class="bi bi-chevron-down text-muted" style="font-size:12px" id="bottom-card-icon"></i>
            </div>
            <div id="status-display" class="mt-3"></div>
            <div id="global-counter" class="mt-2 pt-2 border-top text-center" style="display:none; font-size:9px; font-weight:800; color:var(--blue); letter-spacing:0.5px;">
                <span id="total-active-text"></span>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div class="modal fade" id="modalLine" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered px-4"><div class="modal-content border-0 shadow-lg" style="border-radius:24px"><div class="modal-body p-4 text-center">
        <h6 class="fw-bold mb-3 text-dark">Qual linha você está?</h6>
        <select id="line-select" class="form-select form-select-lg mb-4 rounded-4 border-0 bg-light" style="font-size:14px"></select>
        <button class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow" onclick="window.startTrack()">INICIAR AGORA</button>
    </div></div></div></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7qohXZb_DYFplLOtt5YiqbahwhNYGPck",
            authDomain: "busu-crowd.firebaseapp.com",
            projectId: "busu-crowd",
            storageBucket: "busu-crowd.firebasestorage.app",
            messagingSenderId: "48985646106",
            appId: "1:48985646106:web:1c7b80091855ad01609da3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "jeffersonfbb1997@gmail.com";
        const map = L.map('map', { zoomControl: false }).setView([-14.7981, -39.0347], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let user = null, watchID = null, currentLine = null, userMarker = null;
        const markers = {}, configLinhas = {};

        const calcDist = (la1, lo1, la2, lo2) => {
            const R = 6371;
            const dLat = (la2-la1)*Math.PI/180; const dLon = (lo2-lo1)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        };

        const randomColor = () => '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');

        window.toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        };

        window.switchView = (v) => {
            document.querySelectorAll('.sidebar-view').forEach(view => view.classList.remove('active'));
            document.getElementById('view-' + v).classList.add('active');
        };

        window.toggleDrawer = () => {
            const isCollapsed = document.getElementById('lines-drawer').classList.toggle('collapsed');
            document.getElementById('drawer-icon').className = isCollapsed ? 'bi bi-chevron-down' : 'bi bi-chevron-up';
            document.getElementById('drawer-title').style.display = isCollapsed ? 'none' : 'block';
        };

        window.toggleBottomCard = () => {
            const isMin = document.getElementById('bottom-info-card').classList.toggle('minimized');
            document.getElementById('bottom-card-icon').className = isMin ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
        };

        window.fazeZoom = (id) => {
            if(markers[id]) { map.flyTo(markers[id].getLatLng(), 17); markers[id].openPopup(); }
            if(window.innerWidth < 991) window.toggleSidebar();
        };

        window.geoCenter = () => {
            navigator.geolocation.getCurrentPosition(p => {
                const lat = p.coords.latitude, lng = p.coords.longitude;
                map.flyTo([lat, lng], 17);
                if (userMarker) { userMarker.setLatLng([lat, lng]); } 
                else {
                    userMarker = L.marker([lat, lng], { icon: L.divIcon({ className: 'user-marker-icon' }), zIndexOffset: 2500 }).addTo(map);
                }
            }, null, {enableHighAccuracy:true});
        };

        window.fazerLogin = () => signInWithPopup(auth, provider);
        window.fazerLogout = () => { if(confirm("Sair?")) signOut(auth).then(() => { localStorage.removeItem('busu_active_line'); location.reload(); }); };

        window.onActionClick = () => watchID ? window.stopTrack() : new bootstrap.Modal(document.getElementById('modalLine')).show();

        window.startTrack = () => {
            const line = document.getElementById('line-select').value;
            if(!line) return;
            localStorage.setItem('busu_active_line', line);
            iniciarGPS(line);
            bootstrap.Modal.getInstance(document.getElementById('modalLine')).hide();
        };

        function iniciarGPS(line) {
            if(watchID) navigator.geolocation.clearWatch(watchID);
            currentLine = line;
            watchID = navigator.geolocation.watchPosition(p => {
                if(!user) return;
                const path = `onibus/${line}/${user.uid}`;
                set(ref(db, path), { lat: p.coords.latitude, lng: p.coords.longitude, speed: p.coords.speed || 0, timestamp: Date.now() });
                onDisconnect(ref(db, path)).remove();
                document.getElementById('action-btn').classList.add('active');
                document.getElementById('action-icon').className = 'bi bi-stop-circle-fill';
            }, null, {enableHighAccuracy:true});
        }

        window.stopTrack = () => {
            if(watchID) {
                navigator.geolocation.clearWatch(watchID);
                remove(ref(db, `onibus/${currentLine}/${user.uid}`));
                watchID = null;
                localStorage.removeItem('busu_active_line');
                document.getElementById('action-btn').classList.remove('active');
                document.getElementById('action-icon').className = 'bi bi-broadcast';
            }
        };

        // --- ADMIN CRUD ---
        window.randomizeColorInput = () => {
            document.getElementById('admCor').value = randomColor();
        };

        window.saveLine = () => {
            const id = document.getElementById('admID').value;
            if(!id) return alert("ID obrigatório");
            const corFinal = document.getElementById('admCor').value;
            
            set(ref(db, 'config/linhas/' + id), {
                nome: document.getElementById('admNome').value,
                via: document.getElementById('admVia').value || "Via Principal",
                cor: corFinal,
                icone: document.getElementById('admIcone').value || "🚌",
                latTerminal: -14.7981, lngTerminal: -39.0347
            }).then(() => { alert("Linha Salva!"); window.clearAdminForm(); });
        };

        window.loadLineForEdit = (id) => {
            const c = configLinhas[id];
            document.getElementById('admID').value = id;
            document.getElementById('admNome').value = c.nome;
            document.getElementById('admVia').value = c.via;
            document.getElementById('admCor').value = c.cor;
            document.getElementById('admIcone').value = c.icone;
            document.getElementById('btn-save-line').innerText = "ATUALIZAR LINHA " + id;
        };

        window.clearAdminForm = () => {
            document.getElementById('admID').value = "";
            document.getElementById('admNome').value = "";
            document.getElementById('admVia').value = "";
            document.getElementById('admCor').value = "#1a73e8";
            document.getElementById('admIcone').value = "";
            document.getElementById('btn-save-line').innerText = "SALVAR LINHA";
        };

        window.deleteLine = (id) => { if(confirm("Excluir " + id + "?")) remove(ref(db, 'config/linhas/' + id)); };

        // --- SYNC ---
        onAuthStateChanged(auth, u => {
            user = u;
            const authDiv = document.getElementById('auth-area');
            if(u) {
                authDiv.innerHTML = `<div class="d-flex align-items-center p-2 bg-light rounded-3 shadow-sm mb-3"><img src="${u.photoURL}" width="34" class="rounded-circle me-2"> <div class="flex-grow-1 fw-bold small text-truncate text-start">${u.displayName}</div> <i class="bi bi-box-arrow-right text-muted fs-5 ms-2 cursor-pointer" onclick="window.fazerLogout()"></i></div>`;
                document.getElementById('action-btn').style.display = 'flex';
                if(u.email.toLowerCase().trim() === ADMIN_EMAIL.toLowerCase()) document.getElementById('admin-entry').style.display = 'block';
                const saved = localStorage.getItem('busu_active_line');
                if(saved && !watchID) iniciarGPS(saved);
            } else {
                authDiv.innerHTML = `<button class="btn btn-primary w-100 py-2 fw-bold rounded-pill" style="font-size:12px" onclick="window.fazerLogin()"><i class="bi bi-google me-2"></i> Entrar com Google</button>`;
                document.getElementById('action-btn').style.display = 'none';
            }
        });

        onValue(ref(db, 'config/linhas'), snap => {
            const data = snap.val() || {};
            const select = document.getElementById('line-select'), admin = document.getElementById('admin-lines-list-crud'), planning = document.getElementById('planning-all-lines');
            select.innerHTML = ''; admin.innerHTML = ''; planning.innerHTML = '';
            let tLines = 0;
            for(let id in data) {
                const c = data[id]; configLinhas[id] = c; tLines++;
                select.innerHTML += `<option value="${id}">${id} - ${c.nome} (${c.via})</option>`;
                admin.innerHTML += `<div class="list-group-item d-flex justify-content-between align-items-center p-2 small border-bottom cursor-pointer" onclick="window.loadLineForEdit('${id}')"><div><span class="fw-bold">${id}</span> - ${c.nome}</div><i class="bi bi-trash text-danger" onclick="event.stopPropagation(); window.deleteLine('${id}')"></i></div>`;
                planning.innerHTML += `<div class="nav-item-custom border-bottom" onclick="window.fazeZoom('${id}')"><div><div class="fw-bold">${id} - ${c.nome}</div><div class="text-muted" style="font-size:10px">${c.via}</div></div></div>`;
            }
            document.getElementById('stat-lines').innerText = tLines;
        });

        onValue(ref(db, 'onibus'), snap => {
            const gps = snap.val() || {}, now = Date.now();
            let statusHtml = "", drawerHtml = "", totalGeral = 0;
            const uLat = userMarker ? userMarker.getLatLng().lat : null;
            const uLng = userMarker ? userMarker.getLatLng().lng : null;

            for(let id in configLinhas) {
                const c = configLinhas[id];
                let lt=0, lg=0, ct=0, avgSpeed=0;
                if(gps[id]) {
                    for(let uid in gps[id]) {
                        const info = gps[id][uid];
                        if(now - info.timestamp < 45000) { lt+=info.lat; lg+=info.lng; ct++; avgSpeed += (info.speed || 0); }
                    }
                }
                totalGeral += ct;

                if(ct > 0) {
                    const mLat = lt/ct, mLng = lg/ct;
                    if(!markers[id]) {
                        markers[id] = L.marker([mLat, mLng], { icon: L.divIcon({ className:'custom-pin', html:`<div class="bus-pin pulse" style="background:${c.cor}"><span>${id.substring(0,3)}</span></div>`, iconSize:[42,42], iconAnchor:[21,42] }) }).addTo(map).bindPopup(`<b>${c.nome}</b><br><small>${c.via}</small>`);
                    }
                    markers[id].setLatLng([mLat, mLng]);
                    const d = uLat ? calcDist(uLat, uLng, mLat, mLng) : null;
                    const distT = d ? `${d.toFixed(1)} km` : "--";
                    const speedKmh = (avgSpeed/ct) * 3.6;
                    let eta = (speedKmh > 5 && d) ? Math.round((d / speedKmh) * 60) : "--";

                    drawerHtml += `<div class="d-flex align-items-center mb-3" onclick="window.fazeZoom('${id}')" style="cursor:pointer; color: ${c.cor};"><div class="line-dot-pulse active"></div><div style="flex-grow:1"><div class="bus-title" style="color: #202124;">${id} - ${c.nome}</div><div class="bus-subtitle">${c.via}</div></div></div>`;
                    if (!uLat || d <= 5) {
                        statusHtml += `<div class="bus-item" onclick="window.fazeZoom('${id}')"><div><div class="bus-title">${c.icone} ${id} - ${c.nome}</div><div class="bus-subtitle">${c.via}</div><div class="bus-dist">${distT}</div></div><div class="bus-eta">${eta !== "--" ? eta + ' min' : 'Próximo'}</div></div>`;
                    }
                } else if(markers[id]) { map.removeLayer(markers[id]); delete markers[id]; }
            }
            document.getElementById('floating-active-list').innerHTML = drawerHtml || '<p class="m-0 text-muted" style="font-size:10px">Nenhuma linha operando.</p>';
            document.getElementById('status-display').innerHTML = statusHtml || '<p class="small text-muted m-0" style="font-size:11px;">Buscando frota ativa...</p>';
            const cntDiv = document.getElementById('global-counter');
            if(totalGeral > 0) { cntDiv.style.display = 'block'; document.getElementById('total-active-text').innerText = `${totalGeral} COLABORADORES ATIVOS`; } else { cntDiv.style.display = 'none'; }
        });

        window.onload = () => { setTimeout(() => window.geoCenter(), 2000); };
    </script>
</body>
</html>
