<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BusU-Crowd - Localizador Universitário</title>
    
    <!-- CSS: Bootstrap e Leaflet (Mapa) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .btn-colaborar {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 1000; box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            border-radius: 30px; padding: 12px 24px; font-weight: bold;
        }
        .bus-marker {
            border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 12px; background-color: #dc3545;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <button class="btn btn-primary btn-colaborar" data-bs-toggle="modal" data-bs-target="#modalLinhas">
        📍 Quero Colaborar (Estou no Ônibus)
    </button>

    <!-- Modal Seleção de Linha -->
    <div class="modal fade" id="modalLinhas" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Em qual linha você está?</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <select class="form-select form-select-lg mb-3" id="linhaSelecionada">
                        <option value="" selected disabled>Selecione a Linha...</option>
                        <option value="Linha_01">Linha 01 - Campus / Terminal</option>
                        <option value="Linha_02">Linha 02 - Circular</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success w-100" id="btnIniciarColaboracao">OK, Começar Transmissão!</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Externos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- LOGICA DO APP (FIREBASE + GPS) -->
    <script type="module">
        // 1. Configuração do Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7qohXZb_DYFplLOtt5YiqbahwhNYGPck",
            authDomain: "busu-crowd.firebaseapp.com",
            projectId: "busu-crowd",
            storageBucket: "busu-crowd.firebasestorage.app",
            messagingSenderId: "48985646106",
            appId: "1:48985646106:web:1c7b80091855ad01609da3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 2. Configuração do Mapa
        const map = L.map('map').setView([-14.7981, -39.0347], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        const marcadoresOnibus = {};

        // 3. Lógica do Colaborador (Mandar GPS para o Firebase)
        let idUsuario = "aluno_" + Math.floor(Math.random() * 10000);

        document.getElementById('btnIniciarColaboracao').addEventListener('click', () => {
            const linha = document.getElementById('linhaSelecionada').value;
            if(!linha) return alert("Selecione uma linha!");

            bootstrap.Modal.getInstance(document.getElementById('modalLinhas')).hide();
            
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    const { latitude, longitude } = pos.coords;
                    
                    // Envia para o Firebase: /onibus/Linha_01/aluno_123
                    const caminho = ref(db, `onibus/${linha}/${idUsuario}`);
                    set(caminho, {
                        lat: latitude,
                        lng: longitude,
                        timestamp: Date.now()
                    });

                    // Se o aluno fechar o site, remove do mapa
                    onDisconnect(caminho).remove();

                    document.querySelector('.btn-colaborar').innerHTML = "📡 Transmitindo GPS...";
                    document.querySelector('.btn-colaborar').classList.replace('btn-primary', 'btn-danger');
                }, (err) => alert("Ligue o GPS!"), { enableHighAccuracy: true });
            }
        });

        // 4. Lógica do Espectador (Ver ônibus no Mapa)
        const busRef = ref(db, 'onibus');
        onValue(busRef, (snapshot) => {
            const dados = snapshot.val();
            if(!dados) return;

            // Para cada linha de ônibus
            for (let linhaID in dados) {
                let somaLat = 0, somaLng = 0, totalAlunos = 0;
                
                // Pega a média de todos os alunos naquela linha (Motor de Fusão)
                for (let alunoID in dados[linhaID]) {
                    const info = dados[linhaID][alunoID];
                    if (Date.now() - info.timestamp < 60000) { // Só alunos ativos no último minuto
                        somaLat += info.lat;
                        somaLng += info.lng;
                        totalAlunos++;
                    }
                }

                if (totalAlunos > 0) {
                    const latMedia = somaLat / totalAlunos;
                    const lngMedia = somaLng / totalAlunos;

                    // Atualiza ou cria o marcador no mapa
                    if (marcadoresOnibus[linhaID]) {
                        marcadoresOnibus[linhaID].setLatLng([latMedia, lngMedia]);
                    } else {
                        const icon = L.divIcon({className: 'bus-marker', html: '🚌'});
                        marcadoresOnibus[linhaID] = L.marker([latMedia, lngMedia], {icon: icon}).addTo(map);
                    }
                }
            }
        });
    </script>
</body>
</html>
