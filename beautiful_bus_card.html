<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Card Design Bonito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --blue: #1a73e8;
            --green: #34a853;
            --orange: #fbbc05;
            --red: #ea4335;
            --purple: #9c27b0;
            --gray: #70757a;
            --light-gray: #f8f9fa;
        }
        
        .beautiful-card {
            width: 280px;
            background: white;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        .beautiful-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--blue), var(--green), var(--orange));
        }
        
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .line-badge-beautiful {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgb(207, 94, 9), rgb(145, 66, 6));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(207, 94, 9, 0.3);
            flex-shrink: 0;
        }
        
        .destination-info {
            flex-grow: 1;
            margin-left: 12px;
        }
        
        .destination-main {
            font-weight: 800;
            font-size: 16px;
            color: #1a1a1a;
            line-height: 1.2;
            display: block;
        }
        
        .destination-sub {
            font-size: 11px;
            color: var(--gray);
            font-weight: 500;
            display: block;
            margin-top: 2px;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .company-logo-beautiful {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            object-fit: contain;
        }
        
        .status-dot-beautiful {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse-beautiful 2s infinite;
        }
        
        @keyframes pulse-beautiful {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .location-section-beautiful {
            background: var(--light-gray);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            position: relative;
        }
        
        .location-icon {
            position: absolute;
            left: 12px;
            top: 12px;
            color: var(--blue);
            font-size: 14px;
        }
        
        .location-content {
            margin-left: 24px;
        }
        
        .location-label {
            font-size: 10px;
            color: var(--gray);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .location-text {
            font-size: 13px;
            color: #1a1a1a;
            font-weight: 500;
            line-height: 1.3;
        }
        
        .delay-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(234, 67, 53, 0.1);
            color: var(--red);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 8px;
        }
        
        .delay-tag i {
            font-size: 10px;
        }
        
        .features-row {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(0,0,0,0.08);
        }
        
        .feature-icon-only {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .feature-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }
        
        .feature-circle:hover {
            transform: translateY(-2px);
        }
        
        .feature-circle.ac {
            background: linear-gradient(135deg, var(--blue), #66aaff);
        }
        
        .feature-circle.accessibility {
            background: linear-gradient(135deg, var(--green), #81c995);
        }
        
        .feature-circle.wifi {
            background: linear-gradient(135deg, var(--orange), #fdd663);
        }
        
        .feature-status {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        
        .feature-status.ok {
            background: var(--green);
            box-shadow: 0 0 4px var(--green);
        }
        
        .feature-status.nok {
            background: var(--red);
            box-shadow: 0 0 4px var(--red);
        }
        
        .footer-beautiful {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(0,0,0,0.05);
            text-align: center;
        }
        
        .footer-text {
            font-size: 9px;
            font-weight: 800;
            color: var(--blue);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .real-time-badge {
            display: inline-block;
            background: linear-gradient(90deg, var(--blue), var(--green));
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="beautiful-card">
        <!-- Header -->
        <div class="card-header">
            <div class="line-badge-beautiful">L27</div>
            <div class="destination-info">
                <span class="destination-main">UESC</span>
                <span class="destination-sub">AV. ITABUNA</span>
            </div>
            <div class="header-right">
                <img src="assets/viametro-favicon.png" class="company-logo-beautiful">
                <div class="status-dot-beautiful"></div>
            </div>
        </div>
        
        <!-- Location with integrated delay tag -->
        <div class="location-section-beautiful">
            <div class="location-icon">
                <i class="bi bi-geo-alt"></i>
            </div>
            <div class="location-content">
                <div class="location-label">Localização atual</div>
                <div class="location-text">Rua Herval Soledade</div>
                <div class="delay-tag">
                    <i class="bi bi-clock-history"></i>
                    <span>Atrasado • 15min</span>
                </div>
            </div>
        </div>
        
        <!-- Features - Icons only -->
        <div class="features-row">
            <div class="feature-icon-only">
                <div class="feature-circle ac">
                    <i class="bi bi-snow"></i>
                </div>
                <div class="feature-status nok"></div>
            </div>
            <div class="feature-icon-only">
                <div class="feature-circle accessibility">
                    <i class="bi bi-universal-access"></i>
                </div>
                <div class="feature-status ok"></div>
            </div>
            <div class="feature-icon-only">
                <div class="feature-circle wifi">
                    <i class="bi bi-wifi"></i>
                </div>
                <div class="feature-status ok"></div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer-beautiful">
            <span class="real-time-badge">EM TEMPO REAL</span>
            <div class="footer-text">1 COLABORADOR ATIVO</div>
        </div>
    </div>
</body>
</html>
